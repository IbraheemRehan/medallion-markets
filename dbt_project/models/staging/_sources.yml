version: 2

# Alpha Vantage Bronze Sources
sources:
  - name: bronze
    database: "{{ env_var('BQ_PROJECT_ID', 'roycethreads-email') }}"
    schema: bronze
    tables:
      - name: overview
        config:
          loaded_at_field: "safe.parse_timestamp('%Y%m%dT%H%M%SZ', ingested_at)"
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 7, period: day}

      - name: time_series_daily
        config:
          loaded_at_field: "safe.parse_timestamp('%Y%m%dT%H%M%SZ', ingested_at)"
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 7, period: day}