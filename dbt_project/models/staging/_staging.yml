version: 2

models:
  - name: stg_overview
    description: "One row per company, latest known fundamentals from Alpha Vantage OVERVIEW endpoint."
    columns:
      - name: ticker
        description: "Stock ticker symbol."
        tests:
          - not_null
          - unique

      - name: company_name
        tests:
          - not_null

      - name: sector
        tests:
          - not_null

      - name: exchange
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["NYSE", "NASDAQ", "BATS", "AMEX"]
              config:
                severity: warn

      - name: market_cap
        tests:
          - not_null

  - name: stg_daily_prices
    description: "One row per symbol per trading day, cleaned and typed."
    columns:
      - name: symbol
        tests:
          - not_null

      - name: price_date
        tests:
          - not_null

      - name: close_price
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - symbol
              - price_date