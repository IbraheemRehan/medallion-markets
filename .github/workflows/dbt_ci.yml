name: dbt CI

on:
  pull_request:
    branches: [main]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install dbt-bigquery sqlfluff sqlfluff-templater-dbt

      - name: Write GCP service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-key.json

      - name: Write dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          dbt_project:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account
                project: ${{ secrets.BQ_PROJECT_ID }}
                dataset: dbt_ci
                keyfile: /tmp/gcp-key.json
                threads: 4
                location: US
          EOF

      - name: Install dbt packages
        working-directory: dbt_project
        run: dbt deps

      - name: Lint SQL
        working-directory: dbt_project
        run: sqlfluff lint models --dialect bigquery

      - name: dbt build (CI target)
        working-directory: dbt_project
        run: dbt build --target ci --exclude scd_company_overview
